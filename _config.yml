title: 4X5PI Radio Ham Alcove
description: A personal amateur radio field journal from 4X5PI in Israel.
url: "https://abutbul.github.io"
baseurl: "/4X5PI"
markdown: kramdown
permalink: pretty
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - package.json
  - package-lock.json
  - node_modules
  - .eleventy.js
  - .eleventyignore
  - vendor
  - "**/*:Zone.Identifier"
defaults:
  - scope:
      path: ""
    values:
      layout: page