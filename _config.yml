title: 4X5PI Corner
description: Amateur radio, portable operation, QSLs, and useful radio knowledge.
url: "https://abutbul.github.io"
baseurl: "/4X5PI"
markdown: kramdown
permalink: pretty
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - package.json
  - package-lock.json
  - node_modules
  - .eleventy.js
  - .eleventyignore
  - vendor
defaults:
  - scope:
      path: ""
    values:
      layout: page