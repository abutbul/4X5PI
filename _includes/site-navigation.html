<nav class="site-navigation" aria-label="Site sections">

  </a>
  {% assign top_pages = site.pages | where: "nav_level", "top" | sort: "nav_order" %}
  {% for item in top_pages %}
    {% include navigation-tree.html item=item level=0 %}
  {% endfor %}
</nav>
